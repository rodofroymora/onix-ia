name: Deploy DEV

# Push a dev → deploy al proyecto Vercel de DEV (SEPARADO de producción).
# NUNCA toca el proyecto de producción (onix-ia.com).
# Requiere (Settings → Secrets and variables → Actions): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_DEV_PROJECT_ID.
on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  checks:
    name: Checks de release (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/checks/run-all.js
        env:
          CHECK_BRANCH: dev

  deploy:
    name: Deploy a proyecto DEV
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DEV_PROJECT_ID }}
      # Opcional: si existe el secreto VERCEL_PROD_PROJECT_ID, se usa solo para verificar que DEV no apunte a producción.
      VERCEL_PROD_PROJECT_ID_GUARD: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar secretos y que NO sea el proyecto de producción
        run: |
          faltan=""
          [ -z "$VERCEL_TOKEN" ] && faltan="$faltan VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && faltan="$faltan VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && faltan="$faltan VERCEL_DEV_PROJECT_ID"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos en GitHub:$faltan. Pendiente: crear el proyecto Vercel DEV (separado de producción) y cargar los secretos."
            exit 1
          fi
          # Jamás desplegar el proyecto de PRODUCCIÓN desde este workflow.
          if [ -n "$VERCEL_PROD_PROJECT_ID_GUARD" ] && [ "$VERCEL_PROJECT_ID" = "$VERCEL_PROD_PROJECT_ID_GUARD" ]; then
            echo "::error::VERCEL_DEV_PROJECT_ID apunta al proyecto de PRODUCCIÓN. Abortando: DEV debe ser un proyecto Vercel distinto."
            exit 1
          fi
          echo "✔ Secretos presentes y proyecto distinto de producción"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@59

      # prepare-deploy.js borra scripts/: se guarda antes el verificador posterior al deploy.
      - name: Guardar verificador de indexación
        run: cp scripts/verify-deploy.js "$RUNNER_TEMP/verify-deploy.js"

      - name: Dejar solo archivos públicos e inyectar noindex (DEV; incluye demos/ con noindex)
        env:
          DEPLOY_ENV: dev
        run: node scripts/prepare-deploy.js

      # El proyecto DEV usa su propio "production" (URL estable *.vercel.app del proyecto DEV).
      # Eso NO es producción de onix-ia.com: es otro proyecto. El FUENTE es indexable: el noindex de DEV se inyecta aquí
      # (prepare-deploy.js con DEPLOY_ENV=dev) y se verifica después del deploy.
      - name: vercel pull
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: vercel build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: vercel deploy (proyecto DEV)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### DEV actualizado"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment: $url"
            echo "- Proyecto DEV: separado de producción (onix-ia.com no se toca)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verificación posterior sobre el MISMO deployment de este run: 200 en /, /aviso-de-privacidad, /robots.txt y /sitemap.xml, y DEV sigue noindex (header + meta + robots.txt). Si el deployment está
      # protegido por Vercel (401/403) y no existe el secreto opcional VERCEL_AUTOMATION_BYPASS_SECRET, solo avisa.
      - name: Verificar noindex en el DEV desplegado
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node "$RUNNER_TEMP/verify-deploy.js" --env dev --url "$DEPLOY_URL"
