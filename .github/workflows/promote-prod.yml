name: Promote to PROD (onix-ia.com)

# ÚNICA vía para publicar en producción. Solo manual (workflow_dispatch).
# Merge a main NO publica nada. Requiere:
#  1) OK escrito del dueño del sitio (referencia en `approval_text`, queda en el resumen del run)
#  2) Checks en verde sobre main
#  3) Aprobación del GitHub Environment `production` (revisor requerido: el dueño del sitio)
on:
  workflow_dispatch:
    inputs:
      approval_text:
        description: 'Referencia del OK ESCRITO del dueño del sitio (p. ej. fecha y medio de la aprobación). Sin secretos.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  checks:
    name: Checks sobre main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Solo desde main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow solo se puede ejecutar sobre main (ref actual: $REF)."
            exit 1
          fi

      - name: Validar y registrar OK escrito
        env:
          APPROVAL_TEXT: ${{ inputs.approval_text }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "${#APPROVAL_TEXT}" -lt 10 ]; then
            echo "::error::approval_text es obligatorio (mín. 10 caracteres): referencia del OK escrito del dueño del sitio."
            exit 1
          fi
          {
            echo "## Promoción a PRODUCCIÓN (onix-ia.com)"
            echo "- Solicitada por: \`$ACTOR\`"
            echo "- Commit de main: \`${GITHUB_SHA}\`"
            echo "- Fecha (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "- **OK escrito (referencia):** ${APPROVAL_TEXT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Checks automáticos sobre main
        env:
          CHECK_BRANCH: main
        run: node scripts/checks/run-all.js

  deploy:
    name: Deploy a producción
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment con revisor requerido (dueño del sitio): el job queda en espera hasta que lo apruebe.
    environment:
      name: production
      url: https://onix-ia.com
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar secretos
        run: |
          faltan=""
          [ -z "$VERCEL_TOKEN" ] && faltan="$faltan VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && faltan="$faltan VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && faltan="$faltan VERCEL_PROD_PROJECT_ID"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos en el Environment production:$faltan"
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install --global vercel@59

      - name: Registrar deployment de producción ACTUAL (para rollback)
        run: |
          {
            echo "### Deployment de producción ANTES de esta promoción (para rollback)"
            echo '```'
            vercel inspect onix-ia.com --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" 2>&1 | grep -E 'id|url|created' | head -5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # prepare-deploy.js borra scripts/: se guarda antes el verificador posterior al deploy.
      - name: Guardar verificador de indexación
        run: cp scripts/verify-deploy.js "$RUNNER_TEMP/verify-deploy.js"

      # La URL exacta del sitemap sale de release-rules.json (prepare-deploy.js lo borra del paquete).
      - name: Leer URL del sitemap de las reglas
        run: echo "SITEMAP_URL=$(node -p "require('./release-rules.json').robots.sitemapUrl")" >> "$GITHUB_ENV"

      # DEPLOY_ENV=prod: NO inyecta noindex y ABORTA si el paquete no es indexable (meta/header noindex,
      # robots.txt con «Disallow: /» o sin «Sitemap:», sin sitemap.xml). Excepción: la ruta /salud (robots.rutasNoindex).
      - name: Dejar solo archivos públicos y verificar que sean indexables y sin demos/ (PROD)
        env:
          DEPLOY_ENV: prod
        run: node scripts/prepare-deploy.js

      - name: vercel pull (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: vercel build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: vercel deploy --prod
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Producción actualizada"
            echo "- Deployment: $url"
            echo "- Dominio: https://onix-ia.com"
            echo "- Rollback: usar el deployment anterior registrado al inicio de este resumen"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verificación posterior (solo lectura): producción debe ser indexable. /salud no debe estar publicada (404).
      # Si falla, el deploy YA ocurrió: avisar al CEO y hacer rollback con el deployment anterior registrado arriba.
      - name: Verificar indexación en producción
        run: |
          if ! node "$RUNNER_TEMP/verify-deploy.js" --env prod --url https://www.onix-ia.com --strict --sitemap "$SITEMAP_URL" --404 /salud; then
            {
              echo "### ⚠ La verificación posterior FALLÓ"
              echo "- Producción NO cumple la política de indexación. Avisar al CEO y hacer rollback (Vercel → Instant Rollback al deployment anterior registrado al inicio de este resumen)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Verificación posterior: producción indexable (sin noindex, robots.txt con Sitemap, sitemap.xml, /salud 404)." >> "$GITHUB_STEP_SUMMARY"
