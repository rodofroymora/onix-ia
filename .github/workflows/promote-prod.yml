name: Promote to PROD (onix-ia.com)

# ÚNICA vía para publicar en producción. Solo manual (workflow_dispatch).
# Merge a main NO publica nada. Requiere:
#  1) OK escrito del dueño del sitio (referencia en `approval_text`, queda en el resumen del run)
#  2) Checks en verde sobre main
#  3) Aprobación del GitHub Environment `production` (revisor requerido: el dueño del sitio)
on:
  workflow_dispatch:
    inputs:
      approval_text:
        description: 'Referencia del OK ESCRITO del dueño del sitio (p. ej. fecha y medio de la aprobación). Sin secretos.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  checks:
    name: Checks sobre main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Solo desde main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow solo se puede ejecutar sobre main (ref actual: $REF)."
            exit 1
          fi

      - name: Validar y registrar OK escrito
        env:
          APPROVAL_TEXT: ${{ inputs.approval_text }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "${#APPROVAL_TEXT}" -lt 10 ]; then
            echo "::error::approval_text es obligatorio (mín. 10 caracteres): referencia del OK escrito del dueño del sitio."
            exit 1
          fi
          {
            echo "## Promoción a PRODUCCIÓN (onix-ia.com)"
            echo "- Solicitada por: \`$ACTOR\`"
            echo "- Commit de main: \`${GITHUB_SHA}\`"
            echo "- Fecha (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "- **OK escrito (referencia):** ${APPROVAL_TEXT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Checks automáticos sobre main
        env:
          CHECK_BRANCH: main
        run: node scripts/checks/run-all.js

  deploy:
    name: Deploy a producción
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment con revisor requerido (dueño del sitio): el job queda en espera hasta que lo apruebe.
    environment:
      name: production
      url: https://onix-ia.com
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
      # Bypass de Deployment Protection del proyecto de PRODUCCIÓN (no el de DEV: cada proyecto tiene el suyo).
      BYPASS_SECRET: ${{ secrets.VERCEL_PROD_AUTOMATION_BYPASS_SECRET }}
      DOMINIO: https://www.onix-ia.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar secretos
        run: |
          faltan=""
          [ -z "$VERCEL_TOKEN" ] && faltan="$faltan VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && faltan="$faltan VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && faltan="$faltan VERCEL_PROD_PROJECT_ID"
          [ -z "$BYPASS_SECRET" ] && faltan="$faltan VERCEL_PROD_AUTOMATION_BYPASS_SECRET"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos en el Environment production:$faltan"
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install --global vercel@59

      # Deployment que sirve HOY el dominio: destino del rollback automático.
      - name: Registrar deployment de producción ACTUAL (para rollback)
        id: previo
        run: |
          prev=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/www.onix-ia.com?teamId=$VERCEL_ORG_ID" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);if(!/^dpl_/.test(j.id||""))process.exit(1);console.log(j.id)})')
          echo "id=$prev" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment de producción ANTES de esta promoción (rollback)"
            echo "- \`$prev\`"
            echo "- Rollback manual: \`vercel promote $prev --yes --scope <team> --token <token>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # prepare-deploy.js borra scripts/: se guarda antes el verificador posterior al deploy.
      - name: Guardar verificador de indexación
        run: cp scripts/verify-deploy.js "$RUNNER_TEMP/verify-deploy.js"

      # La URL exacta del sitemap sale de release-rules.json (prepare-deploy.js lo borra del paquete).
      - name: Leer URL del sitemap de las reglas
        run: echo "SITEMAP_URL=$(node -p "require('./release-rules.json').robots.sitemapUrl")" >> "$GITHUB_ENV"

      # DEPLOY_ENV=prod: NO inyecta noindex y ABORTA si el paquete no es indexable. Quita demos/.
      - name: Dejar solo archivos públicos y verificar que sean indexables y sin demos/ (PROD)
        env:
          DEPLOY_ENV: prod
        run: node scripts/prepare-deploy.js

      - name: vercel pull (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # 1) Deployment con destino producción pero SIN asignar el dominio (--skip-domain): nada cambia en onix-ia.com.
      # Sin `vercel build` ni `--prebuilt`, a propósito: el Build Output API no resuelve índices de directorio
      # (la home / daba 404 el 12-oct-2026 aunque index.html estaba en el paquete). Igual que DEV desde el PR #22.
      - name: Deploy candidato (sin dominio)
        id: deploy
        run: |
          out=$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          # Según la versión/entorno el CLI imprime la URL o un JSON ({"deployment":{"url":...}}): se aceptan ambos.
          url=$(printf '%s' "$out" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{d=d.trim();let u;try{u=JSON.parse(d).deployment.url}catch{u=(d.match(/https:\/\/\S+\.vercel\.app/g)||[]).pop()}if(!u)process.exit(1);console.log(u)})')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Candidato: $url (aún sin dominio)" >> "$GITHUB_STEP_SUMMARY"

      # 2) Verificar el candidato con el bypass del proyecto de producción. Sin tolerancia: una respuesta
      # protegida o la página de login de Vercel es FALLO (antes se «verificaba» el login).
      - name: Verificar candidato (antes de tocar el dominio)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if ! node "$RUNNER_TEMP/verify-deploy.js" --env prod --url "$DEPLOY_URL" --strict --ignorar-header-vercel --sitemap "$SITEMAP_URL" --404 /salud --404 /demos/documentos-vivos; then
            echo "### ✖ El candidato NO pasó la verificación: el dominio NO se tocó." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 3) Promover: asigna el dominio al candidato ya verificado (sin reconstruir).
      - name: Promover candidato al dominio
        id: promover
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOY_URL" --yes --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      # 4) Verificar los dominios públicos (sin bypass: así los ve el visitante).
      - name: Verificar dominios
        id: dominio
        run: |
          sleep 10
          ok=1
          BYPASS_SECRET= node "$RUNNER_TEMP/verify-deploy.js" --env prod --url "$DOMINIO" --strict --sitemap "$SITEMAP_URL" --404 /salud --404 /demos/documentos-vivos || ok=0
          code=$(curl -s -o /dev/null -w '%{http_code}' -L https://onix-ia.com/); echo "  $code https://onix-ia.com/ (apex, tras redirección)"
          [ "$code" = "200" ] || ok=0
          if [ "$ok" != 1 ]; then echo "::error::Los dominios no pasaron la verificación."; exit 1; fi
          echo "### ✔ Producción verificada en $DOMINIO y https://onix-ia.com" >> "$GITHUB_STEP_SUMMARY"

      # 5) Rollback automático: solo si falló la promoción o la verificación de dominios (el candidato ya estaba verificado).
      - name: Rollback automático al deployment anterior
        if: failure() && (steps.promover.outcome == 'failure' || steps.dominio.outcome == 'failure') && steps.previo.outputs.id != ''
        env:
          PREV: ${{ steps.previo.outputs.id }}
        run: |
          echo "::error::Rollback automático a $PREV"
          vercel promote "$PREV" --yes --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' "$DOMINIO/")
          echo "### ↩ Rollback automático a \`$PREV\` (home: $code)" >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || { echo "::error::Tras el rollback la home responde $code: intervenir a mano."; exit 1; }
