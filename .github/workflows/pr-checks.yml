name: PR checks

# Se ejecuta en todo PR hacia dev o main. El job "Checks de release" debe marcarse como
# status check REQUERIDO en la protección de ramas;
# así un fallo bloquea el merge.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks de release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Flujo de ramas (cambio/* → dev, dev → main)
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::A main solo se llega con un PR desde dev (dev → main). Rama origen: '$HEAD'. Ver CONTRIBUTING.md"
            exit 1
          fi
          if [ "$BASE" = "dev" ] && ! echo "$HEAD" | grep -Eq '^cambio/[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::Los PRs hacia dev deben venir de una rama 'cambio/<corto>' (minúsculas, números, guiones). Rama origen: '$HEAD'. Ver CONTRIBUTING.md"
            exit 1
          fi
          echo "✔ Flujo de ramas correcto: $HEAD → $BASE"

      - name: Sin secretos ni archivos locales de Vercel versionados
        run: |
          malos=$(git ls-files | grep -E '(^|/)\.env|(^|/)\.vercel(/|$)|(^|/)node_modules/' || true)
          if [ -n "$malos" ]; then
            echo "::error::Hay archivos que NUNCA deben estar en el repo (.env*, .vercel/, node_modules/):"
            echo "$malos"
            exit 1
          fi
          echo "✔ Sin .env*, .vercel/ ni node_modules versionados"

      - name: Checks automáticos (cifras, CTA único, enlaces/assets, QA smoke, frases prohibidas, textos obligatorios)
        env:
          # La regla robots/noindex depende de la rama DESTINO del PR (dev o main)
          CHECK_BRANCH: ${{ github.base_ref }}
        run: node scripts/checks/run-all.js

      - name: Pruebas de la regla CTA (WhatsApp con ?text=)
        run: node scripts/tests/cta-href.test.js

      - name: Pruebas de la excepción «Contáctanos» (ancla interna)
        run: node scripts/tests/cta-contactanos.test.js

      - name: Pruebas de reglas (centinela, sector exacto, WhatsApp, frases prohibidas)
        run: node scripts/tests/reglas.test.js

      - name: Pruebas H-39 (marcadores pendientes bloquean solo en main)
        run: node scripts/tests/bloqueos-main.test.js

      - name: Pruebas de la exención de demos/ en la regla de indexación
        run: node scripts/tests/demos-exentas.test.js

      - name: Pruebas del noindex al desplegar (prepare-deploy / verify-deploy)
        run: node scripts/tests/deploy-noindex.test.js

      - name: Casos de prueba del Arquitecto (check 05, v3)
        run: node scripts/tests/05-frases-arquitecto.test.js

      - name: Pruebas de robots/noindex (solo /salud puede ser noindex en main)
        run: node scripts/tests/robots.test.js

      - name: Pruebas de textos obligatorios y excepción por ruta
        run: node scripts/tests/textos-y-rutas.test.js

      - name: Pruebas del paquete de deploy (DEV con demos y noindex; PROD sin demos)
        run: node scripts/tests/deploy-demos.test.js

      - name: Resumen
        if: always()
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Checks de release: $STATUS"
            echo "PR: \`$HEAD\` → \`$BASE\`"
            echo "Los detalles (en español) están en el log de cada paso. Para correrlos local: \`CHECK_BRANCH=$BASE node scripts/checks/run-all.js\`"
          } >> "$GITHUB_STEP_SUMMARY"
